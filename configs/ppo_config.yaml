# Baseline PPO Configuration for LunarLander-v3
# Stage 2: Pure Gymnasium reward, no custom shaping

algorithm:
  name: "PPO"
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  verbose: 1

environment:
  env_id: "LunarLander-v3"
  continuous: false
  seed: 42

training:
  total_timesteps: 500000
  eval_freq: 10000
  eval_episodes: 20
  checkpoint_freq: 25000
  log_interval: 10

paths:
  models_dir: "models/baseline"
  logs_dir: "logs/baseline"
  experiments_dir: "experiments/baseline"
